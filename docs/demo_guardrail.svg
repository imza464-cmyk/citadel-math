<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="Citadel-Math 5 ms Deterministic Guardrail Terminal Demo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .title { font-size: 12.5px; fill: #94a3b8; font-weight: 600; }
      .badge { font-size: 11px; fill: #38bdf8; font-weight: 600; }
      .prompt { font-size: 12.5px; fill: #38bdf8; font-weight: 600; }
      .cmd { font-size: 12.5px; fill: #e2e8f0; }
      .dim { font-size: 11.5px; fill: #94a3b8; }
      .ok { font-size: 12px; fill: #34d399; font-weight: 600; }
      .warn { font-size: 12px; fill: #fbbf24; font-weight: 600; }
      .err { font-size: 12px; fill: #f87171; font-weight: 600; }
      .val { font-size: 11.5px; fill: #cbd5e1; }
      @keyframes reveal {
        0%, 6%   { opacity: 0; transform: translateY(4px); }
        12%, 90% { opacity: 1; transform: translateY(0); }
        96%, 100%{ opacity: 0; transform: translateY(0); }
      }
      .s1 { animation: reveal 12s ease-in-out infinite; animation-delay: 0s; }
      .s2 { animation: reveal 12s ease-in-out infinite; animation-delay: 1.8s; opacity: 0; }
      .s3 { animation: reveal 12s ease-in-out infinite; animation-delay: 3.8s; opacity: 0; }
      .s4 { animation: reveal 12s ease-in-out infinite; animation-delay: 5.8s; opacity: 0; }
      @media (prefers-reduced-motion: reduce) {
        .s1, .s2, .s3, .s4 { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Window Frame -->
  <rect x="2" y="2" width="876" height="426" rx="12" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  <rect x="2" y="2" width="876" height="36" rx="12" fill="#0f172a"/>
  <rect x="2" y="24" width="876" height="14" fill="#0f172a"/>
  <line x1="2" y1="38" x2="878" y2="38" stroke="#1e293b" stroke-width="1"/>

  <!-- Traffic Lights & Header -->
  <circle cx="22" cy="20" r="5.5" fill="#ef4444"/>
  <circle cx="40" cy="20" r="5.5" fill="#f59e0b"/>
  <circle cx="58" cy="20" r="5.5" fill="#10b981"/>
  <text x="80" y="24" class="mono title">citadel-math // kmath-mcp (Pure Rust + Zero-Eval AST · 5.30 ms p50)</text>
  <rect x="708" y="10" width="154" height="20" rx="5" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
  <text x="720" y="24" class="mono badge">OFFLINE · 0 unsafe</text>

  <!-- Case 1: 1000x Unit Scale Bug -->
  <g class="s1">
    <rect x="20" y="54" width="840" height="84" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="34" y="75" class="mono prompt">[1] kmath_dimension_check("kN", "kg * m / s^2")</text>
    <text x="748" y="75" class="mono dim">3.60 ms · Z^7</text>
    <text x="34" y="98" class="mono warn">⚠ UNIT_SCALE_MISMATCH — Same Z^7 [M L T^-2], but 1000× SI scale factor (1 kN = 1000 N)</text>
    <text x="34" y="120" class="mono val">LLM mistake blocked: silently mixing kilonewtons &amp; newtons in structural thrust equations.</text>
  </g>

  <!-- Case 2: Dropped Singularity -->
  <g class="s2">
    <rect x="20" y="148" width="840" height="84" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="34" y="169" class="mono prompt">[2] kmath_prove_identity("(x^2 - 1) / (x - 1)", "x + 1")</text>
    <text x="748" y="169" class="mono dim">5.30 ms · i64</text>
    <text x="34" y="192" class="mono err">✘ NOT_EQUIVALENT — Algebraically equal ONLY with domain guard: x != 1 (hole singularity)</text>
    <text x="34" y="214" class="mono val">LLM mistake blocked: dropping denominator zero-guards when simplifying rational formulas.</text>
  </g>

  <!-- Case 3: Outward-Rounded Interval64 -->
  <g class="s3">
    <rect x="20" y="242" width="840" height="84" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="34" y="263" class="mono prompt">[3] kmath_interval_eval("(P * r) / t", P=[395k,405k], r=[1.795,1.805], t=[4.9mm,5.1mm])</text>
    <text x="748" y="263" class="mono dim">5.45 ms · 1788</text>
    <text x="34" y="286" class="mono ok">✔ GUARANTEED HOOP STRESS ENCLOSURE: [139.0245098, 149.1887755] MPa (0/1-ULP tightest)</text>
    <text x="34" y="308" class="mono val">Oracle-verified: 25,000+ exact BigInt dyadic vectors + 80-digit Decimal live binary oracle.</text>
  </g>

  <!-- Footer Summary -->
  <g class="s4">
    <rect x="20" y="340" width="840" height="70" rx="8" fill="#0f172a" stroke="#1e3a5f" stroke-width="1"/>
    <text x="34" y="365" class="mono ok">✔ 33/33 Audit Gates (20 Rust + 13 Python) · 85/85 Rust Tests (16/18 modules) · 13/13 Python/Oracle Tests</text>
    <text x="34" y="390" class="mono dim">367 canonical laws (100% golden-anchored, ≥3 sources, 1,031 Dual64 partials) · 80 materials · 11 RCE payloads blocked</text>
  </g>
</svg>
