name: Deploy Documentation Site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "database/**"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build SSOT Static Handbook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate SSOT data bundle (site/build_site.py)
        run: python site/build_site.py

      - name: Verify JavaScript syntax (node --check)
        run: node --check site/app.js && node --check site/data/ssot_bundle.js

      - name: Prepare static site output
        run: |
          mkdir -p _site
          cp -r site/index.html site/styles.css site/app.js site/data _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
