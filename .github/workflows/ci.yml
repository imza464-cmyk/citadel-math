name: CI

on:
  push:
    branches: [main, open-source]
  pull_request:
    branches: [main, open-source]

env:
  CARGO_TERM_COLOR: always
  OPENBLAS_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  verify:
    name: Rust Unit Tests & 26-Gate Verification Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Rust unit test suite (cargo test)
        run: cargo test --manifest-path citadel_math_core/Cargo.toml

      - name: Build release Rust verification engine
        run: cargo build --release --manifest-path citadel_math_core/Cargo.toml

      - name: Run 16-gate native Rust verification suite
        run: ./citadel_math_core/target/release/citadel_math_core audit

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run 10-gate Python & SSOT ontology verification suite
        run: python kmath.py audit
