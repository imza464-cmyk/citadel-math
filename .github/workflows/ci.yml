name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  OPENBLAS_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Rust clippy lint check (-D warnings)
        run: cargo clippy --manifest-path citadel_math_core/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust unit test suite (cargo test)
        run: cargo test --manifest-path citadel_math_core/Cargo.toml

      - name: Build release Rust verification engine
        run: cargo build --release --manifest-path citadel_math_core/Cargo.toml

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Verify Python wheel packaging & CLI entry points (pyproject.toml)
        run: |
          pip install --no-deps .
          kmath stats
          python -c "import kmath_mcp, kmath; assert callable(kmath_mcp.main) and callable(kmath.main)"

      - name: Run 16-gate native Rust verification suite
        run: python kmath.py rust audit

      - name: Run 10-gate Python & SSOT ontology verification suite
        run: python kmath.py audit

      - name: Run MCP security & end-to-end integration tests
        run: python -m unittest discover -s tests -v
