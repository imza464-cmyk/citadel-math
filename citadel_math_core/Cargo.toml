[package]
name = "citadel_math_core"
version = "0.1.0"
edition = "2021"
authors = ["Mekserina"]
license-file = "../LICENSE"
description = "High-Performance Pure-Rust Mathematical Invention Core & Physical Simulation Engine"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
