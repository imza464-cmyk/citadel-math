[package]
name = "citadel_math_core"
version = "0.2.2"
edition = "2021"
authors = ["Mekserina Karaosmanoğlu"]
license = "AGPL-3.0-only"
repository = "https://github.com/imza464-cmyk/citadel-math"
homepage = "https://imza464-cmyk.github.io/citadel-math/"
readme = "../README.md"
keywords = ["dimensional-analysis", "interval-arithmetic", "physics", "verification", "mcp"]
categories = ["science", "mathematics", "aerospace"]
description = "Pure-Rust (#![forbid(unsafe_code)]) Z^7 dimensional shield, checked-i64 algebraic identity checker, IEEE 1788-2015 Interval64, and physics verification core"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
